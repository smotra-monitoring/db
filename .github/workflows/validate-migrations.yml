name: Reusable Validate DB Migrations

on:
  workflow_call:

env:
  GO_VERSION: '1.26'

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smotra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      #  Go is needed for installing golang-migrate
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      #  Install go-migrate from source due it lacking prebuilt binaries with SQLite support
      - name: Install golang-migrate with PostgreSQL and SQLite support
        run: |
          go install -tags 'postgres,sqlite3' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          sudo mv $(go env GOPATH)/bin/migrate /usr/local/bin/migrate

      - name: Verify golang-migrate installation
        run: |
          migrate -version

      - name: Apply "prod up" migrations
        run: |
          migrate \
            -path prod/migrations \
            -database "postgres://postgres:postgres@localhost:5432/smotra_test?sslmode=disable" \
            up

      - name: Apply "prod down" migrations
        run: |
          migrate \
            -path prod/migrations \
            -database "postgres://postgres:postgres@localhost:5432/smotra_test?sslmode=disable" \
            down \
            -all
          
      - name: Apply "dev up" migrations
        run: |
          migrate \
            -path dev/migrations \
            -database "sqlite3://dev.db?cache=shared&mode=rwc&_foreign_keys=1" \
            -verbose \
            up

      - name: Apply "dev down" migrations
        run: |
          migrate \
            -path dev/migrations \
            -database "sqlite3://dev.db?cache=shared&mode=rwc&_foreign_keys=1" \
            -verbose \
            down \
            -all