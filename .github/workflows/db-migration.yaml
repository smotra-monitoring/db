name: Validate DB Migrations

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  call-migration-check:
    uses: ./.github/workflows/validate-migrations.yml